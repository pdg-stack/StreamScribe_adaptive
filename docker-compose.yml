services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - D:/Work/Docker/shared-model-cache:/root/.cache
      - ./logs/backend:/app/logs
      - ./frontend/logs:/app/frontend_logs:ro
    restart: unless-stopped
