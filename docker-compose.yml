services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Named volume, independent of this image/container: models download
      # once into it and survive image rebuilds and container removal, and
      # any other image can mount the same volume. External, so compose
      # never deletes it -- frontend/launch.bat creates it if missing.
      - model-cache:/root/.cache
      - ./logs/backend:/app/logs
      # frontend.log and transcripts.db both live here now (see
      # frontend/logging_config.py and frontend/transcript_store.py) --
      # one read-only mount covers both.
      - ./logs/frontend:/app/frontend_logs:ro
    # launch.bat starts the containers with the app and removes them when it
    # closes, so nothing should auto-restart them in between.
    restart: "no"

  # Live container-log viewer (search, level highlighting, tail) for the
  # backend's stdout -- lighter than a full Grafana/Loki stack. Only shows
  # the backend here: frontend.py runs natively outside Docker (see plan),
  # so its log stays covered by the /logs web page (backend/log_viewer.py)
  # instead, which Dozzle has no way to reach.
  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: "no"

volumes:
  model-cache:
    external: true
    name: shared-model-cache
